log_feed:
  target:
    device:
      integration: nestling
  fields:
    child:
      selector:
        text: {}
    method:
      required: true
      selector:
        select:
          options:
          - breast
          - bottle
          - combo
          - solids
          translation_key: feed_method
    left_minutes:
      selector:
        number:
          min: 0
          max: 1440
          step: 0.5
          mode: box
          unit_of_measurement: min
    right_minutes:
      selector:
        number:
          min: 0
          max: 1440
          step: 0.5
          mode: box
          unit_of_measurement: min
    start_side:
      selector:
        select:
          options:
          - left
          - right
          translation_key: side
    amount:
      selector:
        number:
          min: 0
          max: 2000
          step: 0.1
          mode: box
    volume_unit:
      selector:
        select:
          options:
          - ml
          - oz
          translation_key: volume_unit
    milk:
      selector:
        select:
          options:
          - breast_milk
          - formula
          - mixed
          translation_key: milk
    formula_name:
      selector:
        text: {}
    foods:
      selector:
        text: {}
    start:
      selector:
        datetime: {}
    end:
      selector:
        datetime: {}
    note:
      selector:
        text: {}
